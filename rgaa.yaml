# yaml-language-server: $schema=https://raw.githubusercontent.com/mairie360/CICD/main/tests/a11y/rgaa.schema.json
# RGAA 4.1.2 scope of the administration front (MAIR-316), checked by the rgaa job of mairie360/CICD
# promote-prod.yml on the staging image (format: CICD README, "RGAA scope").
version: 1
target: http://administrator-front:5000

# Sessions (MAIR-680): the engine signs an EdDSA accessToken for the user of a state (as:), like Core
# API, with the run's JWT_PRIVATE_KEY that docker-compose-accessibility.yml hands to the runner
# (accessibility_test.sh generates the key pair). No secret is committed here.
session:
  jwt_timeout: 3600

users:
  # Administration rights come from the database (role "Admin" in init-accessibility.sql), the
  # role claim is ignored.
  admin:
    id: 10
    role: admin

criteria:
  # Images: the logo and the icons of the shell, the tabs and the buttons.
  - "1.1"
  - "1.2"
  - "1.3"
  # 1.4-1.9: no CAPTCHA, chart, image of text or figure caption.
  # 2.x: no frame.
  - "3.1"
  - "3.2"
  - "3.3"
  # 4.x: no media.
  # Tables: the users, roles and sessions tables (simple data tables).
  - "5.4"
  - "5.5"
  - "5.6"
  - "5.7"
  # 5.1, 5.2: no complex table; 5.3, 5.8: no layout table.
  # Links: the navigation of the shell (lib-components AppShell).
  - "6.1"
  - "6.2"
  # Scripts: tabs, selectable rows, confirmation dialogs, status and error messages.
  - "7.1"
  - "7.3"
  - "7.5"
  - "8.1"
  - "8.2"
  - "8.3"
  - "8.4"
  - "8.5"
  - "8.6"
  - "8.9"
  # 8.7, 8.8: no text in another language; 8.10: no right-to-left text.
  - "9.1"
  - "9.2"
  - "9.3"
  # 9.4: no quotation.
  - "10.1"
  - "10.2"
  - "10.3"
  - "10.4"
  - "10.5"
  - "10.6"
  - "10.7"
  - "10.8"
  - "10.9"
  - "10.10"
  - "10.11"
  - "10.12"
  # Forms: search, user, role, group and second factor policy forms.
  - "11.1"
  - "11.2"
  - "11.3"
  - "11.4"
  - "11.5"
  - "11.6"
  - "11.7"
  - "11.9"
  - "11.10"
  - "11.11"
  - "11.12"
  - "11.13"
  # 11.8: no select with option groups.
  # Navigation of the shell, landmarks, skip link, focus order.
  - "12.6"
  - "12.7"
  - "12.8"
  - "12.9"
  # 13.3: no downloadable document.
  - "13.9"
  - "13.11"

states:
  # Users tab (default tab), V2 (MAIR-824): 6 rows per page, actions on each row, forms in modals.
  - id: users
    as: admin
    route: /
    steps:
      - wait_for: { text: remi.aubert@mairie360.fr }
  - id: users-page-2
    description: Second page of the users table
    as: admin
    route: /
    steps:
      - wait_for: { text: remi.aubert@mairie360.fr }
      - click: { role: button, name: Suivant, exact: true }
      - wait_for: { text: "Page 2 /" }
  - id: users-search-empty
    description: A search without result (empty state)
    as: admin
    route: /
    steps:
      - wait_for: { text: remi.aubert@mairie360.fr }
      - fill: { label: Rechercher, exact: true, value: zzzz }
      - wait_for: { text: Aucun utilisateur ne correspond }
  - id: user-create-form
    as: admin
    route: /
    steps:
      - wait_for: { text: remi.aubert@mairie360.fr }
      - click: { role: button, name: Nouvel utilisateur }
      - wait_for: { role: dialog, name: Nouvel utilisateur }
  - id: user-record
    description: The record of a user (identity, role, state, sessions)
    as: admin
    route: /
    steps:
      - click: { text: remi.aubert@mairie360.fr }
      - wait_for: { role: dialog, name: Fiche utilisateur }
  - id: user-edit
    description: "The edit modal (no password section: an administrator never changes a password)"
    as: admin
    route: /
    steps:
      - wait_for: { text: remi.aubert@mairie360.fr }
      - click: { role: button, name: Modifier Rémi Aubert }
      - wait_for: { role: dialog, name: Modifier l’utilisateur }
  - id: user-suspend-confirm
    description: Suspension confirmation dialog (cancelled by the end of the state, nothing written)
    as: admin
    route: /
    steps:
      - wait_for: { text: remi.aubert@mairie360.fr }
      - click: { role: button, name: Suspendre Rémi Aubert }
      - wait_for: { role: alertdialog }
  - id: user-delete-confirm
    description: Deletion confirmation dialog (cancelled by the end of the state, nothing deleted)
    as: admin
    route: /
    steps:
      - wait_for: { text: remi.aubert@mairie360.fr }
      - click: { role: button, name: Supprimer Rémi Aubert }
      - wait_for: { role: alertdialog }
  # Roles tab.
  - id: roles
    as: admin
    route: /
    steps:
      - click: { role: tab, name: Rôles }
      - wait_for: { text: Administrateur système }
  - id: role-edit
    description: The role modal
    as: admin
    route: /
    steps:
      - click: { role: tab, name: Rôles }
      - wait_for: { text: Administrateur système }
      - click: { selector: '.administration-panel button[aria-label^="Modifier le rôle"] >> nth=0' }
      - wait_for: { role: dialog }
  - id: role-delete-confirm
    description: "Deletion dialog of a role (a system role: nothing can be deleted)"
    as: admin
    route: /
    steps:
      - click: { role: tab, name: Rôles }
      - wait_for: { text: Administrateur système }
      - click: { selector: '.administration-panel button[aria-label^="Supprimer"] >> nth=0' }
      - wait_for: { role: alertdialog }
  # Groups tab. No empty-group state: core-api only lists the groups the administrator belongs to,
  # and the owner is always a member.
  - id: groups
    as: admin
    route: /
    steps:
      - click: { role: tab, name: Groupes }
      - wait_for: { text: Services techniques }
  - id: group-detail
    description: A group opened in its panel, its members and the user search to add one
    as: admin
    route: /
    steps:
      - click: { role: tab, name: Groupes }
      - click: { text: Services techniques }
      - wait_for: { text: remi.aubert@mairie360.fr }
  - id: group-delete-confirm
    description: Deletion confirmation dialog of a group (nothing deleted)
    as: admin
    route: /
    steps:
      - click: { role: tab, name: Groupes }
      - click: { text: Services techniques }
      - click: { role: button, name: Supprimer ce groupe }
      - wait_for: { role: alertdialog }
# No state for a user without the Admin role: the page renders its error message, but the
# navigation never reaches network idle (page.goto timeout, see the MAIR-316 report).
# No "no session" state: the middleware redirects to LOGIN_FRONT_URL without a cookie.
