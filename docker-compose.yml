# Stack de développement locale complète pour le front Administration
# (Administrator_Web_Service) : mêmes services que docker-compose-security.yml /
# docker-compose-performance.yml (Postgres + Liquibase + seed, Redis, Core API,
# BFF User, ce front), sans les conteneurs de test ZAP / k6.
#
#   export NODE_AUTH_TOKEN=<ghp_...read:packages>
#   open http://localhost:5000/ once the stack below is up
#
# MAIR-680: Core API alone signs the session JWTs, with an Ed25519 key pair the shell provides:
#
#   source ./stack_secrets.sh      # fresh key pair, exports JWT_PRIVATE_KEY / JWT_PUBLIC_KEY / ACCESS_TOKEN
#   docker compose up -d --build
#
# The Next.js middleware redirects every page without a valid accessToken cookie to
# LOGIN_FRONT_URL. To test without Login_Web_Service, give the browser the token stack_secrets.sh
# signed for the user init-test.sql seeds (sub=2), printed by `echo "$ACCESS_TOKEN"`:
#
#   document.cookie = "accessToken=<ACCESS_TOKEN>"

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# MAIR-680: Core's public key on the whole chain, no JWT_SECRET: the accessToken cookie of the
# front is relayed as is (Bearer) to BFF User, the business BFFs and the APIs.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, source ./stack_secrets.sh before docker compose up}
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: administrator-front-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: administrator-front-dev-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: administrator-front-dev-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: administrator-front-dev-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: administrator-front-dev-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with the run's Ed25519 key pair.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, source ./stack_secrets.sh before docker compose up}
      # The API rate-limits each account (MAIR-425): the runners hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: administrator-front-dev-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: administrator-front-dev-bff-user
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, source ./stack_secrets.sh before docker compose up}
      CORE_API_URL: http://core-api:3000
      # The scanners replay the auth routes from one IP with invalid credentials on purpose: the
      # auth rate limits of BFF User (MAIR-226) would answer 429 and hide the real responses.
      AUTH_RATE_LIMIT_ENABLED: "false"
    expose:
      - "4000"
    networks:
      - backend

  bff-user-ready:
    image: curlimages/curl:latest
    container_name: administrator-front-dev-bff-user-ready
    depends_on:
      bff-user:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-user:4000/health >/dev/null; do
      echo "waiting for bff-user..."; sleep 2; done; echo "bff-user ready"'
    networks:
      - backend

  administrator-front:
    image: ${TARGET_IMAGE:-administrator-front:dev}
    container_name: administrator-front-dev-front
    # Image de production (Next.js standalone), identique à celle publiée par la CI.
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - node_auth_token
    depends_on:
      bff-user-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5000
      BFF_ADMIN_BASE_URL: http://bff-user:4000
      USER_BFF_URL: http://bff-user:4000
    ports:
      - "5000:5000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
