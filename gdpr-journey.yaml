# GDPR usage simulation journey of the administrator front (MAIR-497), played by mairie360/CICD
# tests/gdpr/simulation for every persona of gdpr-simulation.yaml (gdpr-marker.yaml format of
# MAIR-290).
#
# The journey of BFF_user's log marker test, sent to the front's own origin: the same-origin proxy
# (src/lib/bff-proxy.ts) relays it to the BFF with the accessToken cookie as a Bearer token, as for
# the browser, so the logs of the front see the persona's values in the bodies, the query strings
# and the deliberate errors. The proxy only forwards same-origin requests (Origin) and the paths of
# contracts/openapi.json; the first step defines the session headers the next ones reuse
# (*session).
version: 1
target: http://administrator-front:5000
wait: /
# Session of the run (the seeded admin), signed by gdpr_simulation_test.sh.
env: [ADMIN_JWT]
steps:
  # There is no public sign-up: an administrator creates the account.
  - name: create the marker account (admin)
    request:
      method: POST
      path: /admin/users
      headers: &session {Cookie: "accessToken={{env.ADMIN_JWT}}", Origin: "http://administrator-front:5000"}
      json: {first_name: "{{marker.first_name}}", last_name: "{{marker.last_name}}", email: "{{marker.email}}", password: "{{marker.password}}", phone_number: "{{marker.phone}}", phone_country: "FR"}
    expect: [201]
  - name: create the same e-mail again (deliberate error)
    request:
      method: POST
      path: /admin/users
      headers: *session
      json: {first_name: "{{marker.first_name}}", last_name: "{{marker.last_name}}", email: "{{marker.email}}", password: "{{marker.password}}"}
    expect: [409]
  - name: create an account with a too short password (deliberate error)
    request:
      method: POST
      path: /admin/users
      headers: *session
      json: {first_name: "{{marker.first_name}}", last_name: "{{marker.last_name}}", email: "x{{marker.email}}", password: "Mk1!"}
    expect: [400]
  - name: create an account with an invalid e-mail (deliberate error)
    request:
      method: POST
      path: /admin/users
      headers: *session
      json: {first_name: "{{marker.first_name}}", last_name: "{{marker.last_name}}", email: "{{marker.last_name}}", password: "{{marker.password}}"}
    expect: [400]
  - name: search the marker in the admin list (query string)
    request:
      method: GET
      path: "/admin/users?search={{marker.email}}"
      headers: *session
    capture:
      user_id: body.users.0.id
  - name: update the marker as admin (names and phone)
    request:
      method: PATCH
      path: "/admin/users/{{user_id}}"
      headers: *session
      json: {first_name: "{{marker.first_name}}", last_name: "{{marker.last_name}}", phone_number: "{{marker.phone}}", phone_country: "FR"}
  - name: update the marker with an invalid phone (deliberate error)
    request:
      method: PATCH
      path: "/admin/users/{{user_id}}"
      headers: *session
      json: {phone_number: "{{marker.phone}}{{marker.last_name}}"}
    expect: [400]
  - name: reset the marker's password as admin
    request:
      method: PATCH
      path: "/admin/users/{{user_id}}/password"
      headers: *session
      json: {new_password: "{{marker.password}}3"}
